<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ذخیره‌های من | آپارات‌استایل</title>
  <meta name="description" content="کالاهای ذخیره‌شده شما در آپارات‌استایل">
  <!-- ============================================================
       STYLES — every module has its own independent CSS file.
       Only the modules a page needs are loaded (same strategy
       as wp_enqueue_style with per-template conditionals).
       ============================================================ -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/product-card.css">
  <link rel="stylesheet" href="assets/css/page.css">
</head>
<body>
<!-- ============================================================
     SECTION: PAGE HEADER (sub-header) — inner pages only, no footer
     WordPress → header.php — the else-branch (title map + back link)
     ============================================================ -->
<header class="page-header">
  <div class="page-header__in">
    <a href="index.html" class="page-header__back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      ذخیره‌های من
    </a>
      <span class="page-header__icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></span>
  </div>
</header>
<!-- ============================================================
     SECTION: ANNOUNCEMENT BAR — amber strip on top of every page
     WordPress → template-parts/announcement-bar.php (text from Customizer)
     ============================================================ -->
<div class="announce">
  <p>ثبت سفارش موقتاً غیرفعال است</p>
</div>

<main class="page-main">
  <div class="wishlist-page">
    <h1 class="sr-only">ذخیره‌های من</h1>

<!-- ============================================================
     SECTION: WISHLIST GRID — rendered by wishlist.js (localStorage)
     WordPress → template-wishlist.php + inc/wishlist.php (AJAX)
     ============================================================ -->
    <div id="wishlist-empty">
<div class="empty">
        <span class="empty__icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></span>
        <h2 class="empty__title">هنوز چیزی ذخیره نکرده‌اید!</h2>
        <div class="empty__action"><a class="btn" href="catalog.html">شروع خرید</a></div>
      </div>
    </div>
    <div class="wishlist-grid" id="wishlist-grid" hidden><!-- wishlist.js --></div>
  </div>
</main>

  <!-- demo dataset (delete on WP) -->
  <script src="assets/js/data.js" defer></script>
  <!-- cart/wishlist state (delete on WP) -->
  <script src="assets/js/store.js" defer></script>
  <!-- page behaviour -->
  <script src="assets/js/ui.js" defer></script>
  <!-- page behaviour -->
  <script src="assets/js/wishlist.js" defer></script>
</body>
</html>
