<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سبد خرید | آپارات‌استایل</title>
  <meta name="description" content="سبد خرید آپارات‌استایل">
  <!-- ============================================================
       STYLES — every module has its own independent CSS file.
       Only the modules a page needs are loaded (same strategy
       as wp_enqueue_style with per-template conditionals).
       ============================================================ -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/product-card.css">
  <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>
<!-- ============================================================
     SECTION: PAGE HEADER (sub-header) — inner pages only, no footer
     WordPress → header.php — the else-branch (title map + back link)
     ============================================================ -->
<header class="page-header">
  <div class="page-header__in">
    <a href="index.html" class="page-header__back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      سبد خرید
    </a>
      <span class="page-header__icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
  </div>
</header>
<!-- ============================================================
     SECTION: ANNOUNCEMENT BAR — amber strip on top of every page
     WordPress → template-parts/announcement-bar.php (text from Customizer)
     ============================================================ -->
<div class="announce">
  <p>ثبت سفارش موقتاً غیرفعال است</p>
</div>

<main class="page-main">
  <div class="cart">

<!-- ============================================================
     SECTION: CART TABS — cart / next purchase
     WordPress → static design element
     ============================================================ -->
    <div class="tabs">
      <button type="button" class="tab is-active" data-tab="cart">سبد خرید</button>
      <button type="button" class="tab" data-tab="next">خرید بعدی</button>
    </div>

<!-- ============================================================
     SECTION: TAB: CART — lines + summary
     WordPress → WooCommerce cart shortcode
     ============================================================ -->
    <section id="tab-cart" class="tab-panel">

      <!-- empty state (cart.js shows it when the cart has no items) -->
      <div id="cart-empty" hidden>
<div class="empty">
          <span class="empty__icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
          <h2 class="empty__title">سبد خرید شما خالی است</h2>
          <p class="empty__subtitle">هنوز کالایی اضافه نکرده‌اید.</p>
          <div class="empty__action"><a class="btn" href="catalog.html">مشاهده محصولات</a></div>
        </div>
      </div>

      <div id="cart-filled">
        <div class="cart__layout">

          <!-- cart lines -->
          <div class="cart__items" id="cart-items">
<!-- ============================================================
     SECTION: CART LINE — STATIC SAMPLE for design review
     WordPress → WooCommerce cart table row
     ============================================================ -->
          <!-- cart.js replaces this node at runtime (localStorage) -->
          <div class="cart-line">
            <a href="product.html"><img class="cart-line__img" src="https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/4eb0669f503c.jpg" alt="پولوشرت یقه راه‌راه"></a>
            <div class="cart-line__body">
              <p class="cart-line__brand">نارین</p>
              <p class="cart-line__name">پولوشرت یقه راه‌راه</p>
              <p class="cart-line__variant">طرح: شیری | سایز: M</p>
              <p class="cart-line__price">۴,۵۸۸,۰۰۰ تومان</p>
              <div class="cart-line__actions">
                <!-- qty stepper: dir=ltr, minus on the left -->
                <div class="qty" dir="ltr">
                  <button type="button" class="qty__btn" aria-label="کاهش تعداد" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                  <span class="qty__value">۱</span>
                  <button type="button" class="qty__btn" aria-label="افزایش تعداد"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                </div>
                <button type="button" class="cart-line__remove" aria-label="حذف از سبد"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
              </div>
            </div>
          </div>
          </div>

<!-- ============================================================
     SECTION: SUMMARY BOX — totals + submit order
     WordPress → WC cart totals + checkout button
     ============================================================ -->
          <aside class="summary">
            <div class="summary__rows" id="summary-rows"><!-- cart.js --></div>
            <div class="summary__total" id="summary-total"><!-- cart.js --></div>
            <button type="button" class="summary__submit" id="submit-order">ثبت سفارش</button>
          </aside>

        </div>
      </div>
    </section>

<!-- ============================================================
     SECTION: TAB: NEXT PURCHASE — wishlist grid
     WordPress → same loop as template-wishlist.php
     ============================================================ -->
    <section id="tab-next" class="tab-panel" hidden>
      <div id="next-empty" hidden>
<div class="empty">
          <span class="empty__icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></span>
          <h2 class="empty__title">لیست خرید بعدی خالی است</h2>
          <p class="empty__subtitle">کالاهای ذخیره‌شده اینجا نمایش داده می‌شوند.</p>
          <div class="empty__action"><a class="btn" href="catalog.html">شروع خرید</a></div>
        </div>
      </div>
      <div class="cart__next-grid" id="next-grid" hidden><!-- cart.js --></div>
    </section>
  </div>
</main>

  <!-- demo dataset (delete on WP) -->
  <script src="assets/js/data.js" defer></script>
  <!-- cart/wishlist state (delete on WP) -->
  <script src="assets/js/store.js" defer></script>
  <!-- page behaviour -->
  <script src="assets/js/ui.js" defer></script>
  <!-- page behaviour -->
  <script src="assets/js/cart.js" defer></script>
</body>
</html>
